<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060a" />
    <title>GPU Boids &mdash; 3D Infinity</title>
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: rgba(12, 16, 26, 0.72);
        --panel-border: rgba(120, 180, 255, 0.18);
        --accent: #6fd3ff;
        --text: #dce6f5;
        --muted: #7f8ca6;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        color: var(--text);
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        -webkit-tap-highlight-color: transparent;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        padding: 8px 11px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        pointer-events: none;
        white-space: pre;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
      }
      #hud b {
        color: var(--text);
        font-weight: 600;
      }
      #panel {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        width: 264px;
        max-height: calc(100vh - 20px);
        overflow-y: auto;
        padding: 12px 12px 16px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        backdrop-filter: blur(10px);
        transition: transform 0.22s ease, opacity 0.22s ease;
        z-index: 10;
      }
      #panel.collapsed {
        transform: translateX(calc(100% + 14px));
        opacity: 0;
        pointer-events: none;
      }
      #panel h1 {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }
      .group {
        margin-bottom: 10px;
      }
      .group > .title {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 12px 0 6px;
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 4px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 7px 0;
      }
      .row label {
        flex: 0 0 104px;
        color: var(--muted);
        font-size: 11px;
      }
      .row .val {
        flex: 0 0 46px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        color: var(--text);
      }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1 1 auto;
        height: 3px;
        background: rgba(120, 180, 255, 0.22);
        border-radius: 3px;
        outline: none;
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        box-shadow: 0 0 6px rgba(111, 211, 255, 0.6);
      }
      input[type='range']::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      input[type='color'] {
        -webkit-appearance: none;
        appearance: none;
        flex: 0 0 auto;
        width: 46px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
      }
      input[type='color']::-webkit-color-swatch-wrapper {
        padding: 2px;
      }
      input[type='color']::-webkit-color-swatch {
        border: none;
        border-radius: 4px;
      }
      input[type='color']::-moz-color-swatch {
        border: none;
        border-radius: 4px;
      }
      .toggle {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        color: var(--text);
        font-size: 11px;
        user-select: none;
      }
      .toggle input {
        accent-color: var(--accent);
        width: 14px;
        height: 14px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0 4px;
      }
      button.action {
        flex: 1 1 auto;
        min-width: 54px;
        padding: 6px 8px;
        border-radius: 7px;
        border: 1px solid var(--panel-border);
        background: rgba(111, 211, 255, 0.1);
        color: var(--text);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      button.action:hover {
        background: rgba(111, 211, 255, 0.22);
        border-color: var(--accent);
      }
      button.action:active {
        transform: translateY(1px);
      }
      .status {
        min-height: 14px;
        margin-top: 2px;
        font-size: 11px;
        line-height: 1.35;
        color: var(--muted);
        word-break: break-word;
      }
      .status.ok {
        color: var(--accent);
      }
      .status.error {
        color: #ff9a9a;
      }
      button.tab-toggle {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        z-index: 11;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid var(--panel-border);
        background: var(--panel-bg);
        color: var(--accent);
        font-size: 18px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        display: none;
      }
      button.tab-toggle.show {
        display: block;
      }
      #error {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        background: #05060a;
        z-index: 100;
        text-align: center;
      }
      #error.show {
        display: grid;
      }
      #error .box {
        max-width: 520px;
        border: 1px solid rgba(255, 120, 120, 0.4);
        background: rgba(40, 12, 12, 0.6);
        border-radius: 12px;
        padding: 22px 24px;
        line-height: 1.6;
      }
      #error h2 {
        margin: 0 0 8px;
        color: #ff9a9a;
        font-size: 15px;
      }
      #error code {
        color: var(--accent);
      }
      @media (max-width: 720px) {
        #panel {
          width: 232px;
          transform: translateX(calc(100% + 14px));
          opacity: 0;
          pointer-events: none;
        }
        #panel.open {
          transform: translateX(0);
          opacity: 1;
          pointer-events: auto;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/editor-BoFoz_lo.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/platform-DmYaX5eH.js">
  </head>
  <body>
    <canvas id="gl"></canvas>

    <div id="hud"></div>
    <button class="tab-toggle" id="panelToggle">&#9776;</button>
    <aside id="panel">
      <h1>Boids &middot; Infinity</h1>
      <div id="controls"></div>
    </aside>

    <div id="error">
      <div class="box">
        <h2 id="errorTitle">WebGL2 unavailable</h2>
        <p id="errorBody"></p>
      </div>
    </div>

  </body>
</html>
